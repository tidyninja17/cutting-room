<title>Cutting Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cutting-room workbench — project rail on the left, a pattern-card work surface on the right. */
:root {
  --bg: #eef0f2; --panel: #ffffff; --card: #e8dcbf; --card-edge: #cdbb92;
  --ink: #1b2430; --muted: #5d6673; --line: #d5d9df; --accent: #1f4f7a; --accent-ink: #ffffff;
  --tape: #f2c230; --tape-ink: #2a2100; --mark: #a3291e; --grain: #1f5a9e;
  --ok: #2f7d4a; --warn: #a86a00; --bad: #b3261e; --ok-bg: #e6f2ea; --warn-bg: #fbf1dc; --bad-bg: #f9e4e1;
  --display: "Gloock", "Georgia", serif;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14181d; --panel: #1c2229; --card: #2e2a22; --card-edge: #4a4233;
  --ink: #e6e9ed; --muted: #9aa3ae; --line: #2f3740; --accent: #7fb3e6; --accent-ink: #0d1520;
  --tape: #f2c230; --tape-ink: #2a2100; --mark: #ff8a7a; --grain: #8cc0ff;
  --ok: #6fcf8f; --warn: #f0b44c; --bad: #ff8a7a; --ok-bg: #1d3326; --warn-bg: #3a2e14; --bad-bg: #3d1f1b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14181d; --panel: #1c2229; --card: #2e2a22; --card-edge: #4a4233;
  --ink: #e6e9ed; --muted: #9aa3ae; --line: #2f3740; --accent: #7fb3e6; --accent-ink: #0d1520;
  --tape: #f2c230; --tape-ink: #2a2100; --mark: #ff8a7a; --grain: #8cc0ff;
  --ok: #6fcf8f; --warn: #f0b44c; --bad: #ff8a7a; --ok-bg: #1d3326; --warn-bg: #3a2e14; --bad-bg: #3d1f1b; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--panel); border-right: 1px solid var(--line); padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand h1 { font: 26px/1 var(--display); margin: 0; letter-spacing: .2px; }
.brand span { font: 11px var(--mono); color: var(--muted); }
.tape { height: 10px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 10px), var(--tape); opacity: .9; }
.rail h2 { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 6px; }
.folder { display: grid; gap: 2px; }
.folder > summary { list-style: none; cursor: pointer; font-weight: 600; padding: 4px 6px; border-radius: 4px; display: flex; justify-content: space-between; }
.folder > summary::-webkit-details-marker { display: none; }
.folder > summary .n { font: 12px var(--mono); color: var(--muted); }
.proj { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px 6px 18px; border-radius: 4px; cursor: pointer; }
.proj small { display: block; color: var(--muted); font-size: 12px; }
.proj:hover { background: var(--bg); }
.proj[aria-current="true"] { background: var(--tape); color: var(--tape-ink); }
.proj[aria-current="true"] small { color: var(--tape-ink); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 4px 8px; font-size: 13px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.vlist { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
.vlist td { padding: 6px 8px; vertical-align: middle; }
.vlist tr:last-child td { border-bottom: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { min-width: 0; padding-block: 20px 40px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.head h2 { font: 32px/1.1 var(--display); margin: 0; text-wrap: balance; }
.head .sub { color: var(--muted); }
.versions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.vchip { font: 13px var(--mono); border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.vchip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vchip .lock { margin-left: 4px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tape); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.grid2 > * { min-width: 0; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.dgrid > * { min-width: 0; }
@media (max-width: 1000px) { .dgrid { grid-template-columns: minmax(0, 1fr); } }
fieldset { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
legend { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; padding: 0; }
.field { display: grid; gap: 3px; }
.field label { font-size: 13px; color: var(--muted); }
.field label b { color: var(--bad); font-weight: 600; }
.field input, .field select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 6px 8px; }
.field input[type=number] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.field.check { grid-template-columns: auto 1fr; align-items: center; gap: 6px; padding-top: 18px; }
.field.check input { width: auto; }
input:disabled, select:disabled { opacity: .7; }
.unit { font: 11px var(--mono); color: var(--muted); }
.banner { border-radius: var(--r); padding: 10px 14px; border: 1px solid; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.banner.warn { background: var(--warn-bg); border-color: var(--warn); }
.banner.bad { background: var(--bad-bg); border-color: var(--bad); }
.banner.ok { background: var(--ok-bg); border-color: var(--ok); }
.issues { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.issue { display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: start; }
.issue::before { content: ""; align-self: stretch; border-radius: 3px; background: var(--warn); }
.issue.block::before { background: var(--bad); }
.issue p { margin: 0; } .issue .q { color: var(--muted); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--card-edge); border-radius: var(--r); overflow: auto; max-height: 78vh; position: relative; }
.card svg.pattern { display: block; width: 100%; height: auto; }
.card.zoom svg.pattern { width: 220%; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: baseline; }
.pill { font: 600 11px var(--mono); border-radius: 999px; padding: 1px 8px; text-align: center; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.checks small { color: var(--muted); font-family: var(--mono); font-size: 12px; display: block; }
h3 { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; }
.stack { display: grid; gap: 16px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-variant-numeric: tabular-nums; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); text-align: right; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
td.num { font-family: var(--mono); text-align: right; }
.scroll { overflow-x: auto; }
.note { white-space: pre-wrap; max-width: 68ch; margin: 0; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.exp { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.exp .opt { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; background: var(--panel); }
.exp .opt b { font-size: 16px; } .exp .opt span { color: var(--muted); font-size: 13px; }
.empty { display: grid; place-items: center; text-align: center; gap: 10px; padding: 60px 16px; color: var(--muted); }
.empty h2 { font: 30px var(--display); color: var(--ink); margin: 0; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r); max-width: 360px; z-index: 20; }
.sync { font: 12px var(--mono); color: var(--muted); }
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; z-index: 30; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal .panel { width: min(520px, 100%); display: grid; gap: 12px; }
.fault { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fault:last-child { border-bottom: 0; }
.fault .deltas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.fault .deltas label { font: 12px var(--mono); color: var(--muted); display: flex; gap: 4px; align-items: center; }
.fault .deltas input { width: 64px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 2px 4px; font-family: var(--mono); }
.diag { border-left: 3px solid var(--accent); padding-left: 10px; display: grid; gap: 6px; }
.deltas { display: flex; flex-wrap: wrap; gap: 8px; }
.deltas label { font: 12px var(--mono); color: var(--muted); display: flex; gap: 4px; align-items: center; }
.deltas input { width: 64px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 2px 4px; font-family: var(--mono); }
.gstep { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
.gstep > div { display: grid; gap: 6px; min-width: 0; }
.gnum { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg); font: 600 12px/24px var(--mono); text-align: center; }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; }
.glist { display: grid; gap: 4px; }
.gchip { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
.gchips .gchip { border-radius: 999px; padding: 4px 12px; }
.gchip:hover { border-color: var(--accent); }
.gchip[aria-pressed="true"] { background: var(--tape); color: var(--tape-ink); border-color: var(--tape); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mlayout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 16px; align-items: start; }
.mlayout > * { min-width: 0; }
.vpanel { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); display: grid; gap: 8px; }
.vpanel h3 { margin: 0; }
.v3d { position: relative; height: min(72vh, 680px); border-radius: var(--r); overflow: hidden;
  background: radial-gradient(120% 80% at 50% 30%, var(--panel), var(--bg)); border: 1px solid var(--line); touch-action: none; }
.v3d canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.v3d canvas:active { cursor: grabbing; }
.v3d-views { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; z-index: 1; }
.v3d-msg { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.vfacts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12px; color: var(--muted); }
.vfacts b { display: block; font: 500 14px var(--mono); color: var(--ink); }
@media (max-width: 1100px) { .mlayout { grid-template-columns: minmax(0, 1fr); } .vpanel { position: static; order: -1; } .v3d { height: 440px; } }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="rail" aria-label="Projects">
    <div class="brand"><h1>Cutting Room</h1><span id="engineTag"></span></div>
    <div class="tape" aria-hidden="true"></div>
    <button class="btn primary" id="newProject">New project</button>
    <nav id="projectList" aria-label="Project folders"><p class="muted">Loading projects…</p></nav>
    <div style="margin-top:auto; display:grid; gap:8px">
      <button class="btn ghost" id="houseBtn">House calibration</button>
      <span class="sync" id="sync"></span>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
(function () {
  "use strict";
  const C = window.Cutter, X = window.CutterExport;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const r1 = (v) => (Math.round(v * 10) / 10);
  const vid = (n) => "v" + String(n).padStart(3, "0");
  $("#engineTag").textContent = (window.__BUILD__ ? "v" + window.__BUILD__.version + " · " : "") + "engine " + C.ENGINE_VERSION;
  if (window.__PLATFORM__ === "local") { const b = document.createElement("a"); b.className = "btn ghost"; b.href = "api/export"; b.textContent = "Download backup"; b.style.textAlign = "center"; b.style.textDecoration = "none"; $("#houseBtn").after(b); }

  // ---------- form schema ----------
  const SCHEMA = [
    { group: "measurements", legend: "Measurements (mm)", fields: [
      ["waist", "Waist (worn height)", "num", true], ["seat", "Seat", "num", true], ["outside_leg", "Outside leg (in shoes)", "num", true],
      ["inside_leg", "Inside leg", "num", true], ["thigh", "Thigh", "num", true], ["knee", "Knee", "num", true], ["bottom", "Bottom (finished)", "num", true],
      ["body_rise", "Seated body rise", "num"], ["front_rise", "Front rise (through legs)", "num"], ["back_rise", "Back rise (through legs)", "num"], ["calf", "Calf", "num"],
      ["waist_position", "Waist taken at", ["natural_waist", "mid"]],
    ] },
    { group: "figuration", legend: "Figuration", fields: [
      ["seat", "Seat", ["normal", "flat", "prominent"]], ["stomach", "Stomach", ["normal", "flat", "prominent", "corpulent"]],
      ["stance", "Stance", ["normal", "erect", "stooping"]], ["hips", "Hips", ["level", "left_low", "right_low"]], ["hip_mm", "Low hip by (mm)", "num"],
      ["legs", "Legs", ["straight", "bow", "knock"]], ["thighs", "Thighs", ["normal", "heavy"]],
    ] },
    { group: "style", legend: "Style", fields: [
      ["rise", "Rise", ["natural_waist", "mid"]], ["front", "Front", ["flat", "single_forward_pleat", "double_forward_pleat", "reverse_pleat"]],
      ["waistband", "Waistband", ["straight", "side_adjusters", "fishtail_braces", "belt_loops"]], ["side_pockets", "Side pockets", ["on_seam", "cross", "none"]],
      ["hip_pockets", "Hip pockets (jetted)", ["0", "1", "2"]], ["hip_pocket_button", "Hip pocket buttons", "check"],
      ["bottoms", "Bottoms", ["plain", "turn_up"]], ["turnup_depth", "Turn-up depth (mm)", "num"],
      ["break", "Break", ["none", "slight", "full"]], ["leg_line", "Leg line", ["slim", "classic", "full"]],
    ] },
    { group: "cloth", legend: "Cloth", fields: [
      ["type", "Cloth", "text"], ["weight", "Weight (g/m)", "num"], ["stretch", "Stretch (%)", "num"],
      ["shrinkage_length", "Shrinkage, length (%)", "num"], ["shrinkage_width", "Shrinkage, width (%)", "num"],
    ] },
  ];
  const blankInput = () => ({
    measurements: { waist_position: "natural_waist" },
    figuration: { seat: "normal", stomach: "normal", stance: "normal", hips: "level", legs: "straight", thighs: "normal" },
    style: { rise: "natural_waist", front: "single_forward_pleat", waistband: "side_adjusters", side_pockets: "on_seam", hip_pockets: "1", hip_pocket_button: true, bottoms: "plain", break: "slight", leg_line: "classic" },
    cloth: { type: "", weight: null, stretch: 0, shrinkage_length: 0, shrinkage_width: 0 },
    adjustments: {}, confirmed: [],
  });
  const pretty = (s) => String(s).replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());

  // ---------- state ----------
  const S = { db: null, downloads: null, projects: [], versions: [], house: {}, pid: null, vnum: null, tab: "measures", work: null, spec: null, local: false, zoom: false, fitting: null, unsubV: null, loaded: false };
  const sel = () => S.projects.find((p) => p.id === S.pid) || null;
  const curV = () => S.versions.find((v) => v.n === S.vnum) || null;

  function toast(msg, ms = 3200) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), ms); }
  function sync(msg) { $("#sync").textContent = msg; }

  // one write at a time per document
  const chains = {};
  function write(path, fn) {
    if (!S.db) return Promise.resolve();
    chains[path] = (chains[path] || Promise.resolve()).then(fn).then(() => sync("Saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })))
      .catch((e) => { sync("Not saved"); toast(e && e.code === "quota_exceeded" ? "Storage is full. Delete old projects to save more." : "Couldn't save: " + (e && (e.message || e.code))); });
    return chains[path];
  }
  // local fallback store (when db is unavailable)
  const LS = { projects: [], versions: {} };

  // ---------- boot ----------
  async function boot() {
    renderMain();
    const timer = setTimeout(() => { if (!S.loaded) { $("#projectList").innerHTML = '<p class="muted">Projects can’t be reached yet. Check your connection; this page keeps trying.</p>'; } }, 10000);
    const use = (n) => { try { return window.claude && window.claude.use ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };
    const [db, downloads] = await Promise.all(["db", "downloads"].map(use));
    S.db = db; S.downloads = downloads;
    if (!db) {
      clearTimeout(timer); S.local = true; S.loaded = true;
      sync("Not saving: projects store unavailable in this view");
      renderRail(); renderMain(); return;
    }
    db.collection("projects").onSnapshot((snap) => {
      S.loaded = true; if (!snap.metadata.fromCache) clearTimeout(timer);
      S.projects = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
      if (S.pid && !sel()) { S.pid = null; S.versions = []; }
      renderRail(); if (!S.pid) renderMain();
    }, (e) => { clearTimeout(timer); $("#projectList").innerHTML = `<p class="muted">Projects couldn’t load (${esc(e.code)}).</p>`; });
    db.doc("settings/house").onSnapshot((d) => { S.house = d.exists ? d.data().values || {} : {}; if (S.work) recompute(); }, () => {});
  }

  function openProject(pid) {
    if (S.pid === pid) return;
    S.pid = pid; S.vnum = null; S.versions = []; S.work = null; S.spec = null; S.fitting = null; S.tab = "measures";
    if (S.unsubV) S.unsubV();

  // ---------- rail ----------

  // ---------- Measures ----------

    const F = S.fitting; if (!F) return [];
    const out = [];
    F.diag.forEach((d) => (d.deltas || []).forEach((x) => out.push({ param: x.param, value: Number(x.value) || 0, reason: d.observation })));
    return out.filter((d) => d.value);
  }
  function pendingHTML() {
    const D = allDeltas();
    if (!D.length) return '<p class="muted">Add findings from the guide to build the corrections.</p>';
    const cur = S.work.adjustments || {}; const tot = {};
    D.forEach((d) => (tot[d.param] = (tot[d.param] || 0) + d.value));
    return `<table><thead><tr><th>Change</th><th class="num">This fitting</th><th class="num">New total</th></tr></thead><tbody>${Object.entries(tot).map(([k, x]) => `<tr><td>${esc(C.ADJ_PARAMS[k]?.label || k)}</td><td class="num">${x > 0 ? "+" : ""}${r1(x)}</td><td class="num">${r1((cur[k] || 0) + x)} ${esc(C.ADJ_PARAMS[k]?.unit || "")}</td></tr>`).join("")}</tbody></table>`;
  }
  document.addEventListener("change", (e) => {
    const t = e.target; const F = S.fitting; if (!F) return;
    if (t.dataset.act === "diagVal") { F.diag[Number(t.dataset.i)].deltas[Number(t.dataset.j)].value = Number(t.value); refreshPending(); }
    if (t.dataset.act === "gVal") { const r = guideResult(); F.guide.vals = F.guide.vals || r.res.deltas.map((d) => d.value); F.guide.vals[Number(t.dataset.i)] = Number(t.value); }
  });
  document.addEventListener("input", (e) => { if (!S.fitting) return; if (e.target.id === "fitNotes") S.fitting.notes = e.target.value; });
  function refreshPending() { const p = $("#pending"); if (p) p.innerHTML = pendingHTML(); const btn = $('[data-act="saveFitting"]'); if (btn) btn.disabled = !allDeltas().length; }
  function guideClick(a, t) {
    const F = S.fitting; if (!F) return false; const g = F.guide;
    if (a === "gArea") { F.guide = { area: t.dataset.val }; }
    else if (a === "gSym") { F.guide = { area: g.area, symptom: t.dataset.val }; }
    else if (a === "gOpt") { F.guide = { area: g.area, symptom: g.symptom, option: Number(t.dataset.val) }; }
    else if (a === "gAdd") {
      const r = guideResult(); if (!r || !r.res) return true;
      const vals = r.res.deltas.map((d, i) => { const el = document.getElementById("gv_" + i); return el ? Number(el.value) : d.value; });
      F.diag.push({ observation: r.label, cause: r.res.cause, deltas: r.res.deltas.map((d, i) => ({ param: d.param, value: vals[i] })) });
      F.guide = {}; renderTab(); toast("Added to findings"); return true;
    } else if (a === "gRemove") { F.diag.splice(Number(t.dataset.i), 1); renderTab(); return true; }
    else return false;
    const el = $("#guide"); if (el) el.innerHTML = guideHTML();
    return true;
  }

  async function saveFitting() {
    const v = curV(); const F = S.fitting; const D = allDeltas(); if (!D.length) return;
    const newN = nextN();
    const observations = F.diag.map((d) => d.observation);
    const fitting = { date: new Date().toISOString(), observations, notes: F.notes || "", deltas: D, next: newN };
    const adj = { ...(S.work.adjustments || {}) }; D.forEach((d) => (adj[d.param] = r1((adj[d.param] || 0) + d.value)));
    const input = structuredClone(S.work); delete input._locked; input.adjustments = adj;
    const inputBase = structuredClone(S.work); delete inputBase._locked;
    await createVersion(newN, input, `after fitting ${observations.length ? "on v" + v.n : ""}`.trim(), v.n);
    const lockPatch = { locked: true, fitting, house: structuredClone(S.house || {}), input: inputBase };
    if (S.local) Object.assign(v, lockPatch);
    else await write(`projects/${S.pid}/versions/${v.id}`, () => S.db.doc(`projects/${S.pid}/versions/${v.id}`).update(lockPatch));
    S.fitting = null; toast(`Fitting recorded on v${v.n}. Now on v${newN}.`);
    if (S.local) { S.versions = LS.versions[S.pid]; selectVersion(newN); }
  }

  async function createVersion(n, input, label, parent) {
    const doc = { n, label: label || "", input, created: new Date().toISOString(), updated: new Date().toISOString(), parent: parent ?? null, locked: false, engine: C.ENGINE_VERSION };
    const id = vid(n);
    const pr = sel(); S.pendingSelect = n;
    if (S.local) { (LS.versions[S.pid] = LS.versions[S.pid] || []).push({ id, ...doc }); S.versions = LS.versions[S.pid]; pr.latest = n; pr.maxN = Math.max(Number(pr.maxN) || 0, n); pr.updated = doc.created; renderRail(); return; }
    await write(`projects/${S.pid}/versions/${id}`, () => S.db.doc(`projects/${S.pid}/versions/${id}`).set(doc));
    await write(`projects/${S.pid}`, () => S.db.doc(`projects/${S.pid}`).update({ latest: n, maxN: Math.max(Number(pr.maxN) || 0, n), updated: doc.created }));
  }

  // ---------- Export ----------
  function tabExport(b) {
    const s = S.spec;
    if (!s || s.status !== "ok") { b.innerHTML = `<div class="banner warn">Resolve the measures first; there is no pattern to print yet.</div>`; return; }
    const m = meta();
    const info = (k) => { try { return X.pdfInfo(s, m, k); } catch (e) { return { pages: "?", size: "" }; } };
    const a4 = info("a4"), a0 = info("a0"), roll = info("roll");
    const can = !!S.downloads;
    b.innerHTML = `
      ${can ? "" : '<div class="banner warn">Downloads aren’t available in this view. Open the page in Claude to save files.</div>'}
      <div class="banner ok"><span>All files are 1:1 in millimetres. Print PDFs at <b>100% / actual size</b> and measure the 100 mm square before cutting.</span></div>
      <div class="exp">
        <div class="opt"><b>Tiled A4 PDF</b><span>${a4.pages} pages (${a4.size}), blank tiles skipped. Join on the grey border; half-diamonds meet at each joint.</span><button class="btn primary" data-act="pdf" data-f="a4" ${can ? "" : "disabled"}>Save A4 PDF</button></div>
        <div class="opt"><b>A0 PDF</b><span>${a0.pages} sheets (${a0.size}) for a copy shop.</span><button class="btn" data-act="pdf" data-f="a0" ${can ? "" : "disabled"}>Save A0 PDF</button></div>
        <div class="opt"><b>Plotter roll PDF</b><span>One page, ${esc(roll.size)}, for a 914 mm roll.</span><button class="btn" data-act="pdf" data-f="roll" ${can ? "" : "disabled"}>Save roll PDF</button></div>
        <div class="opt"><b>SVG</b><span>Vector at true size (mm units) for CAD or a cutter.</span><button class="btn" data-act="svg" ${can ? "" : "disabled"}>Save SVG</button></div>
        <div class="opt"><b>DXF (zipped)</b><span>R12 DXF in mm with layers CUT, NET, GRAIN, MARKS, TEXT.</span><button class="btn" data-act="dxf" ${can ? "" : "disabled"}>Save DXF</button></div>
        <div class="opt"><b>Draft spec JSON</b><span>Every point, rule, check and correction for this version.</span><button class="btn" data-act="json" ${can ? "" : "disabled"}>Save JSON</button></div>
      </div>`;
  }
  const fname = (ext) => { const p = sel(), v = curV(); return `${(p.name + (p.client ? "-" + p.client : "")).replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-")}-v${v.n}.${ext}`; };
  async function save(filename, data) {
    try { await S.downloads.save({ filename, data }); toast("Saved " + filename); }
    catch (e) { if (e.code !== "declined") toast({ rate_limited: "A save is already waiting. Finish it first.", too_large: "File too large for this destination." }[e.code] || "Couldn’t save (" + e.code + ")."); }
  }
  async function doExport(kind, f) {
    const s = S.spec, m = meta();
    try {
      if (kind === "pdf") { toast("Building PDF…", 1500); await new Promise((r) => setTimeout(r, 30)); const ab = X.toPDF(s, m, f, window.jspdf.jsPDF); await save(fname(f === "a4" ? "A4.pdf" : f === "a0" ? "A0.pdf" : "roll.pdf"), new Blob([ab], { type: "application/pdf" })); }
      if (kind === "svg") await save(fname("svg"), X.toSVG(s, m));
      if (kind === "dxf") { const z = new JSZip(); z.file(fname("dxf"), X.toDXF(s, m)); z.file("README.txt", `${m.project} ${m.version}\nUnits: millimetres. Layers: CUT (cut line), NET (stitch line), GRAIN, MARKS (notches, darts, pleats, pockets), TEXT.\nEngine ${C.ENGINE_VERSION}.`); await save(fname("zip"), await z.generateAsync({ type: "blob" })); }
      if (kind === "json") { const out = structuredClone(s); out.input = structuredClone(S.work); delete out.input._locked; out.project = m; await save(fname("json"), JSON.stringify(out, null, 2)); }
    } catch (e) { console.error(e); toast("Export failed: " + (e.message || e)); }
  }

  // ---------- Spec ----------
  function tabSpec(b) {
    const s = S.spec; const out = s ? { ...s, pieces: s.pieces ? s.pieces.map((p) => ({ id: p.id, name: p.name, material: p.material, count: p.count, net_points: p.net.length, cut_points: p.cut.length })) : undefined } : {};
    b.innerHTML = `<div class="panel"><div class="toolbar"><h3 style="margin:0">Draft specification</h3><button class="btn sm" data-act="copySpec">Copy JSON</button></div><pre class="mono" id="specPre" style="overflow:auto; max-height:70vh; margin:0; font-size:12px">${esc(JSON.stringify(out, null, 2))}</pre></div>`;
  }

  // ---------- modals ----------
  function modal(html, onSubmit) {
    const root = $("#modalRoot");
    root.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><form class="panel" id="mdl">${html}</form></div>`;
    const f = $("#mdl"); f.querySelector("input,select,textarea")?.focus();
    f.addEventListener("submit", async (e) => { e.preventDefault(); const ok = await onSubmit(new FormData(f)); if (ok !== false) root.innerHTML = ""; });
    f.addEventListener("click", (e) => { if (e.target.dataset.act === "cancel") root.innerHTML = ""; });
    root.querySelector(".modal").addEventListener("keydown", (e) => { if (e.key === "Escape") root.innerHTML = ""; });
  }
  const folderOptions = () => [...new Set(S.projects.map((p) => p.folder).filter(Boolean))].map((f) => `<option value="${esc(f)}">`).join("");
  function newProjectModal() {
    modal(`<h3>New project</h3>
      <div class="field"><label for="np_name">Project name</label><input id="np_name" name="name" required placeholder="Navy flannel, double pleat"></div>
      <div class="field"><label for="np_client">Client</label><input id="np_client" name="client" placeholder="Client name or reference"></div>
      <div class="field"><label for="np_folder">Folder</label><input id="np_folder" name="folder" list="folders" placeholder="e.g. Clients A–M, or a season"><datalist id="folders">${folderOptions()}</datalist></div>
      <div class="field"><label for="np_copy">Start from</label><select id="np_copy" name="copy"><option value="">Blank measures</option>${S.projects.map((p) => `<option value="${esc(p.id)}">Latest version of ${esc(p.name)}</option>`).join("")}</select></div>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="cancel">Cancel</button><button class="btn primary">Create</button></div>`,
      async (fd) => {
        const name = String(fd.get("name")).trim(); if (!name) return false;
        let input = blankInput();
        const copy = fd.get("copy");
        if (copy) {
          try {
            const vs = S.local ? LS.versions[copy] || [] : (await S.db.collection(`projects/${copy}/versions`).get()).docs.map((d) => d.data());
            const last = vs.sort((a, b) => a.n - b.n).pop(); if (last) { input = structuredClone(last.input); input.adjustments = {}; input.confirmed = []; }
          } catch (e) { toast("Couldn’t copy measures; starting blank."); }
        }
        const now = new Date().toISOString();
        const doc = { name, client: String(fd.get("client") || "").trim(), folder: String(fd.get("folder") || "").trim(), notes: "", created: now, updated: now, latest: 1 };
        let pid;
        if (S.local) { pid = "p" + Date.now(); LS.projects.push({ id: pid, ...doc }); S.projects = LS.projects.slice(); renderRail(); }
        else { const ref = S.db.collection("projects").doc(); pid = ref.id; await write(`projects/${pid}`, () => ref.set(doc)); }
        if (S.local) { S.pid = null; openProject(pid); await createVersion(1, input, "first draft", null); selectVersion(1); }
        else { const vref = S.db.doc(`projects/${pid}/versions/${vid(1)}`); await write(`projects/${pid}/versions/${vid(1)}`, () => vref.set({ n: 1, label: "first draft", input, created: now, updated: now, parent: null, locked: false, engine: C.ENGINE_VERSION })); openProject(pid); }
        toast("Project created");
      });
  }
  function editProjectModal() {
    const p = sel();
    modal(`<h3>Edit project</h3>
      <div class="field"><label for="ep_name">Project name</label><input id="ep_name" name="name" required value="${esc(p.name)}"></div>
      <div class="field"><label for="ep_client">Client</label><input id="ep_client" name="client" value="${esc(p.client || "")}"></div>
      <div class="field"><label for="ep_folder">Folder</label><input id="ep_folder" name="folder" list="folders2" value="${esc(p.folder || "")}"><datalist id="folders2">${folderOptions()}</datalist></div>
      <div class="field"><label for="ep_notes">Notes</label><input id="ep_notes" name="notes" value="${esc(p.notes || "")}"></div>
      <div class="field"><label>Versions</label><div id="vlist" class="vlist">${versionListHTML()}</div></div>
      <div class="field"><label for="ep_del">Delete project</label><input id="ep_del" name="del" placeholder="Type DELETE to remove this project and its versions"></div>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="cancel">Cancel</button><button class="btn primary">Save</button></div>`,
      async (fd) => {
        if (String(fd.get("del")).trim() === "DELETE") {
          if (S.local) { LS.projects = LS.projects.filter((x) => x.id !== p.id); S.projects = LS.projects.slice(); }
          else { for (const v of S.versions) await write(`projects/${p.id}/versions/${v.id}`, () => S.db.doc(`projects/${p.id}/versions/${v.id}`).delete()); await write(`projects/${p.id}`, () => S.db.doc(`projects/${p.id}`).delete()); }
          if (S.unsubV) S.unsubV(); S.pid = null; S.versions = []; renderRail(); renderMain(); toast("Project deleted"); return;
        }
        const patch = { name: String(fd.get("name")).trim() || p.name, client: String(fd.get("client") || "").trim(), folder: String(fd.get("folder") || "").trim(), notes: String(fd.get("notes") || "").trim(), updated: new Date().toISOString() };
        if (S.local) { Object.assign(p, patch); renderRail(); renderHead(); } else await write(`projects/${p.id}`, () => S.db.doc(`projects/${p.id}`).update(patch));
      });
  }
  function versionListHTML(armed) {
    if (!S.versions.length) return '<p class="muted" style="margin:0">No versions.</p>';
    const only = S.versions.length === 1;
    return `<table><tbody>${S.versions.map((v) => {
      const notes = [v.label, v.locked ? "fitted" : "", v.n === S.vnum ? "open now" : ""].filter(Boolean).join(" · ");
      const from = S.versions.filter((x) => x.parent === v.n).map((x) => "v" + x.n);
      const btn = only ? '<span class="muted" style="font-size:12px">Last version</span>'
        : armed === v.n ? `<span class="row"><button type="button" class="btn sm danger" data-act="delVersionGo" data-n="${v.n}">Delete v${v.n}</button><button type="button" class="btn sm ghost" data-act="delVersionNo">Keep</button></span>`
        : `<button type="button" class="btn sm ghost" data-act="delVersion" data-n="${v.n}">Delete</button>`;
      return `<tr><td class="mono">v${v.n}</td><td>${esc(notes)}${armed === v.n && (v.locked || from.length) ? `<div class="muted" style="font-size:12px">${v.locked ? "Its fitting record goes with it. " : ""}${from.length ? from.join(", ") + " keep their own measures and adjustments." : ""}</div>` : ""}</td><td style="text-align:right">${btn}</td></tr>`;
    }).join("")}</tbody></table>`;
  }
  async function deleteVersion(n) {
    const v = S.versions.find((x) => x.n === n); if (!v || S.versions.length < 2) return;
    const p = sel(); const rest = S.versions.filter((x) => x.n !== n); const latest = rest[rest.length - 1].n;
    const patch = { latest, maxN: Math.max(Number(p.maxN) || 0, ...S.versions.map((x) => x.n)), updated: new Date().toISOString() };
    if (S.local) { LS.versions[S.pid] = rest; S.versions = rest; Object.assign(p, patch); }
    else {
      await write(`projects/${S.pid}/versions/${v.id}`, () => S.db.doc(`projects/${S.pid}/versions/${v.id}`).delete());
      await write(`projects/${S.pid}`, () => S.db.doc(`projects/${S.pid}`).update(patch));
      S.versions = rest;
    }
    if (S.vnum === n) selectVersion(latest); else renderHead();
    renderRail();
    const vl = $("#vlist"); if (vl) vl.innerHTML = versionListHTML();
    toast(`Deleted v${n}`);
  }
  const HOUSE_FIELDS = [
    ["seatEase.flat", "Seat ease, flat front"], ["seatEase.single_forward_pleat", "Seat ease, single pleat"], ["seatEase.double_forward_pleat", "Seat ease, double pleat"], ["seatEase.reverse_pleat", "Seat ease, reverse pleat"],
    ["waistEase", "Waist ease"], ["waistEaseBraces", "Waist ease with braces"], ["frontForkDiv", "Front fork = seat ÷"], ["backForkDiv", "Back fork = seat ÷"],
    ["seatAngleDeg", "Seat angle (°)"], ["seatLineFrac", "Seat line above fork (× rise)"], ["backRaise", "Back waist raise"], ["fishtailRise", "Fishtail rise"], ["cfInset", "CF waist inset"],
    ["backInsideLegShorten", "Back inside leg ironwork"], ["backHemDrop.slight", "Back hem drop, slight break"], ["backHemDrop.full", "Back hem drop, full break"], ["backHemDrop.none", "Back hem drop, no break"],
    ["sideSuppressMax", "Max side seam suppression"], ["dartMax", "Max back dart"], ["crotchEase", "Crotch ease"],
    ["kneeOverBottom.slim", "Knee over bottom, slim"], ["kneeOverBottom.classic", "Knee over bottom, classic"], ["kneeOverBottom.full", "Knee over bottom, full"],
    ["inlay.backSeamWaist", "Inlay, back seam at waist"], ["inlay.side", "Inlay, side seams"], ["inlay.inside", "Inlay, inside leg"], ["inlay.hemPlain", "Hem, plain"], ["inlay.hemTurnupExtra", "Hem, turn-up extra"], ["inlay.other", "Seam allowance, other"],
  ];
  const getPath = (o, p) => p.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o);
  function houseModal() {
    const eff = C.deepMerge(C.DEFAULTS, S.house || {});
    modal(`<h3>House calibration</h3><p class="muted" style="margin:0">Values in mm unless marked. They apply to every unfitted version; fitted versions keep the values they were cut with.</p>
      <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap:8px 12px; max-height:55vh; overflow:auto">${HOUSE_FIELDS.map(([k, l]) => `<div class="field"><label for="h_${k}">${l}</label><input id="h_${k}" name="${k}" type="number" step="any" value="${getPath(eff, k)}" placeholder="${getPath(C.DEFAULTS, k)}"></div>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><button type="button" class="btn ghost" data-act="resetHouse">Reset to defaults</button><span class="row"><button type="button" class="btn ghost" data-act="cancel">Cancel</button><button class="btn primary">Save</button></span></div>`,
      async (fd) => {
        const values = {};
        HOUSE_FIELDS.forEach(([k]) => { const v = fd.get(k); if (v === "" || v == null) return; const n = Number(v); if (!Number.isFinite(n) || n === getPath(C.DEFAULTS, k)) return; const ks = k.split("."); let o = values; ks.slice(0, -1).forEach((x) => (o = o[x] = o[x] || {})); o[ks[ks.length - 1]] = n; });
        S.house = values; recompute(); if (S.pid) renderTab();
        if (!S.local) await write("settings/house", () => S.db.doc("settings/house").set({ values, updated: new Date().toISOString() }));
        toast("House calibration saved");
      });
  }

  // ---------- global clicks ----------
  document.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-act],[data-tab],[data-v]"); if (!t) return;
    if (t.dataset.tab && !t.dataset.act) { S.tab = t.dataset.tab; renderTab(); return; }
    if (t.dataset.v && !t.dataset.act) { selectVersion(Number(t.dataset.v)); return; }
    const a = t.dataset.act;
    if (a === "new") newProjectModal();
    if (a === "editProject") editProjectModal();
    if (a === "firstVersion") { await createVersion(1, blankInput(), "first draft", null); }
    if (a === "dup") { const v = curV(); const n = nextN(); const input = structuredClone(v.input); await createVersion(n, input, `from v${v.n}`, v.n); if (S.local) { S.pendingSelect = null; selectVersion(n); } toast(`Created v${n} from v${v.n}`); }
    if (a === "clearAdj") { delete S.work.adjustments[t.dataset.k]; recompute(); saveWork(); renderTab(); }
    if (a === "delVersion") { const vl = $("#vlist"); if (vl) vl.innerHTML = versionListHTML(Number(t.dataset.n)); return; }
    if (a === "delVersionNo") { const vl = $("#vlist"); if (vl) vl.innerHTML = versionListHTML(); return; }
    if (a === "delVersionGo") { t.disabled = true; await deleteVersion(Number(t.dataset.n)); return; }
    if (a === "zoom") { S.zoom = !S.zoom; renderTab(); }
    if (a && a.startsWith("g") && guideClick(a, t)) return;
    if (a === "saveFitting") { t.disabled = true; await saveFitting(); }
    if (["pdf", "svg", "dxf", "json"].includes(a)) doExport(a, t.dataset.f);
    if (a === "copySpec") { const txt = $("#specPre").textContent; try { await navigator.clipboard.writeText(txt); toast("Copied"); } catch { const r = document.createRange(); r.selectNodeContents($("#specPre")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected. Copy with your keyboard."); } }
    if (a === "resetHouse") { $("#modalRoot").innerHTML = ""; S.house = {}; recompute(); if (S.pid) renderTab(); if (!S.local) await write("settings/house", () => S.db.doc("settings/house").set({ values: {}, updated: new Date().toISOString() })); toast("House calibration reset"); }
  });
  $("#newProject").addEventListener("click", newProjectModal);
  $("#houseBtn").addEventListener("click", houseModal);

  boot();
})();
</script>
